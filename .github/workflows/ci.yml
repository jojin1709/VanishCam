name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Manifest, files, syntax and privacy checks
        run: node scripts/validate.js

      - name: Package the extension
        run: |
          mkdir -p package
          cp manifest.json background.js bridge.js i18n.js effect.js snapdetect.js inject.js package/
          cp -r icons package/

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: VanishCam-extension
          path: package/
